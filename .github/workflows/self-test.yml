name: Self-test
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Install Doltgres
        run: tools/install-doltgres.sh "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: End-to-end test on the fixture
        run: bash tests/run.sh
