- id: per-app-switching-wayland
  type: problem
  title: Presets that follow the focused application are impossible on Wayland, and the docs do not say so
  summary: 'Users keep asking for presets that switch by focused application or window (seven items over five years). The maintainer answers each time that Wayland hides window focus, so it cannot work
    on every desktop. Verified at upstream cb8f5fd: README, usage.md and examples.md do not state this limit or the workaround (input-remapper-control bound to a desktop shortcut, or an X11 window-watcher
    script). Candidate PR: an FAQ entry. The feature itself is not being asked of the maintainer.'
  status: open
