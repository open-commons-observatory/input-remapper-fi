- id: no-non-systemd-init-scripts
  type: problem
  title: Only a systemd unit ships; no OpenRC, runit or sysv scripts
  summary: 'Only data/input-remapper.service ships, so the daemon cannot be autostarted on OpenRC, runit or sysv systems (Gentoo, Artix, Alpine, postmarketOS). In #15 the maintainer asked for a PR and community
    members posted working OpenRC and runit scripts in the thread. Verified at upstream cb8f5fd: no OpenRC, runit or sysv files in the repository. Candidate PR: contributed init scripts plus a README section;
    needs someone who can test on those systems.'
  status: open
