- id: uinput-module-not-loaded
  type: problem
  title: Injection fails when the uinput kernel module is not loaded
  summary: 'Injection fails with "could not open uinput device" when the uinput kernel module is not loaded (reported on Arch and postmarketOS; fixed by running modprobe uinput, sometimes needed after a
    kernel upgrade). Verified at upstream cb8f5fd: no modprobe, modules-load.d file or troubleshooting note exists in the docs, install scripts, packaging or data/. Candidate PR: ship a modules-load.d entry
    for uinput with the package and add a troubleshooting note to the README. Not yet tested on a distribution.'
