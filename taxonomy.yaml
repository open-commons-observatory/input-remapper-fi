# input-remapper vocabulary (converted from the v1 analysis taxonomy).
# A tag is facet:value and only values listed here are accepted by the database.
facets:
  kind:
    multi: false
    page: true
    doc: What the issue is
    values:
      bug: defect in input-remapper
      regression: used to work, broke after a code or system update
      feature-request: asks for new behaviour that does not exist
      question: asks how something works (usage, config, keysyms)
      support: install, setup or troubleshooting help
      docs: documentation gap, error or typo
      security: security or trust concern
      meta: about the project itself (governance, naming, packaging)
      spam: noise, off-topic, duplicate, empty or test issue
  ctype:
    multi: false
    page: false
    doc: What a commit is
    values:
      feature: new behaviour added
      fix: bug or regression fix
      docs: documentation only
      build: build system, packaging, CI
      maintenance: merges, version bumps, housekeeping
      refactor: code restructure, no behaviour change
      test: tests only
      release: release preparation
  layer:
    multi: true
    page: true
    doc: Where in the system the problem sits
    values:
      daemon: input-remapper-service background process
      gui: GTK configuration UI
      reader: event reader (reads raw events from input devices via evdev)
      injector: event injector (writes events to virtual uinput device)
      mapping: mapping and preset logic (translates one event to another)
      macro: macro engine (sequences, variables, if/wait expressions)
      combination: key combination detection and matching
      config: configuration and preset files (storage, migration, format)
      device: device detection, discovery and enumeration
      permissions: udev rules, uinput access, group membership, capabilities
      install: packaging, service registration, system-level setup
      docs: documentation only (README, wiki, in-app hints)
  cause:
    multi: true
    page: true
    doc: Root cause — use unknown when not established; grow this list as you read
    values:
      unknown: not established
      config-error: wrong user configuration
      regression: broke after a code change in input-remapper
      wayland-issue: Wayland-specific behaviour or missing protocol support
      x11-issue: X11-specific behaviour (XInput, XTest, XKB)
      de-compat: desktop environment compatibility (KDE, GNOME, XFCE quirk)
      device-quirk: non-standard or undocumented device behaviour
      permission: missing udev rules, uinput device access, group membership
      evdev-api: evdev API usage or kernel evdev behaviour
      uinput-api: uinput API usage or virtual device handling
      python-version: Python version incompatibility or dependency version
      race-condition: timing or ordering issue in daemon or reader
      missing-feature: requested functionality does not exist (feeds feature-request kind)
      doc-gap: documentation missing, wrong or misleading
      distro-compat: distro-specific packaging, init system or path issue
      macro-logic: bug in macro expression parsing or execution
      combination-logic: key combination detection or matching defect
      ui-logic: GTK UI logic or state management defect
      symbol-mapping: wrong or missing keysym, evdev type or code
      autoload-failure: device plug/unplug autoloading of presets not working (very common cluster)
  component:
    multi: true
    page: false
    doc: Which component of input-remapper
    values:
      service: input-remapper-service (systemd unit)
      gui-app: input-remapper-gtk (GTK application)
      reader: InputReader / EventReader
      injector: Injector / InputInjector
      macros: macro runner and parser
      presets: preset / config manager
      keycodes: key symbol and code lookup (input_remapper.configs.input_config)
      udev: udev rules and device groups
      ci-build: CI, packaging, Makefile
  device_type:
    multi: true
    page: false
    doc: What type of input device is involved
    values:
      keyboard: physical keyboard
      mouse: mouse or trackpad
      gamepad: gamepad or controller
      joystick: joystick (may overlap with gamepad)
      tablet: graphics tablet or stylus
      other: other or unspecified input device
  de_os:
    multi: true
    page: false
    doc: Desktop environment or distro involved
    values:
      x11: X11 / Xorg session
      wayland: Wayland session (any compositor)
      kde: KDE Plasma
      gnome: GNOME Shell
      xfce: XFCE
      sway: Sway / wlroots compositor
      ubuntu: Ubuntu or Debian
      arch: Arch Linux / Manjaro (was already there — confirm present)
      fedora: Fedora or RHEL
      nixos: NixOS
      opensuse: openSUSE
      any: any / not specified
      openrc: OpenRC init system (Gentoo, Alpine, Artix)
  outcome:
    multi: false
    page: false
    doc: How the issue ended
    values:
      fixed: fixed in a code or docs commit
      workaround: a workaround was given or found
      wontfix: declined by the maintainer
      not-a-bug: working as designed
      docs-answer: answered by pointing to existing docs
      duplicate: closed as duplicate of another issue
      open: still open and active
      stale: open but long inactive (no activity 6+ months)
      unknown: no visible resolution or conclusion
  pr_potential:
    multi: false
    page: true
    doc: 'Actionability: how likely a PR could close this. Filled after reading; assessed for the current state
      of the fork (grenudi/input-remapper). This facet is the bridge between the dataset and the contribution plan.'
    values:
      code-fix: a targeted code change would close it (small to medium effort)
      docs-fix: a documentation update or in-app hint would close it
      needs-design: needs architectural discussion or maintainer buy-in before a PR
      upstream-dep: root cause is upstream (kernel, evdev, GTK, Wayland protocol); fix requires upstream change
      close-duplicate: should be closed as duplicate; no code needed
      wontfix: maintainer would likely decline; not actionable
      resolved: closed with a fix, answer or workaround; no change to the project is needed
      unknown: not yet assessed
  conf:
    multi: false
    page: false
    doc: Confidence of the root cause
    values:
      stated: maintainer said
      reported: reporter said
      inferred: my reading
  impact:
    multi: true
    page: false
    doc: Effect on the user
    values:
      broken-remap: remapping has no effect at all
      partial-remap: remapping works sometimes, in some conditions, or partially
      crash: daemon or GUI crashes or hangs
      install-blocked: cannot install, start, or enable the service
      perf: input lag, CPU use or resource problem
      ui-bug: GUI cosmetic or workflow problem (does not affect remapping itself)
      na: not applicable
  symptom:
    multi: true
    page: false
    doc: What the reporter observed — weak labels derived from text; a search aid, not a diagnosis
    values:
      mapping-not-working: remapping or injection has no visible effect
      key-stuck: key stays pressed or repeats unexpectedly
      daemon-not-starting: input-remapper-service will not start or exits immediately
      gui-crash: the GTK UI crashes, freezes or fails to open
      permission-error: permission denied accessing uinput or device node
      wrong-output: wrong key, button or axis value is emitted
      combination-not-firing: a key combination does not trigger as configured
      macro-error: macro fails to parse or execute
      device-not-detected: the input device does not appear in the UI or reader
      lag: noticeable input lag or delay
      install-fail: installation, pip install or package manager step fails
      wayland-broken: works on X11 but broken or not functional on Wayland
      service-unit-issue: systemd service file, enable/disable or autostart problem
  change_type:
    multi: false
    page: true
    doc: What kind of change this is (ISO/IEC/IEEE 14764 maintenance types). Reactive = corrective + adaptive; proactive
      = the rest.
    values:
      corrective: fixes a defect users hit
      adaptive: keeps the software working as its environment changes (OS, desktop, dependencies, hardware)
      perfective: improves performance, usability or maintainability of behaviour that exists
      preventive: restructures so future change is cheaper and safer, with no visible behaviour change (refactoring,
        tests)
      additive: adds functionality that does not exist yet
  quality:
    multi: true
    page: true
    doc: Which product-quality characteristic is affected (ISO/IEC 25010:2023).
    values:
      functional-suitability: does the right things, completely and correctly
      performance-efficiency: speed, resource use, capacity
      compatibility: coexists and interoperates with other software and platforms
      interaction-capability: how easy and pleasant it is to use and learn (was usability)
      reliability: keeps working, recovers from failure
      security: protects data and access
      maintainability: cost and safety of changing it (modularity, testability, analysability)
      flexibility: adapts to new environments and installs (was portability)
      safety: avoids harm to people or the environment
  dimension:
    multi: true
    page: false
    doc: Which of ITIL 4's four dimensions the entry belongs to; the lens for a project-level assessment.
    values:
      people: maintainers, contributors, users and the community around the project
      information-technology: code, architecture, tests, documentation and tooling
      partners: upstream dependencies, distributions, packagers and platforms the project relies on
      processes: 'how work flows: review, release, CI, support, triage'
  value:
    multi: false
    page: false
    doc: Relative benefit if the register entry is resolved (register entries only).
    values:
      low: nice to have
      medium: clear benefit for a group of users or maintainers
      high: removes a serious or widespread problem, or a project-level risk
  effort:
    multi: false
    page: false
    doc: Relative size of the work (register entries only).
    values:
      small: a focused change, reviewable in one sitting
      medium: several files or a design discussion
      large: architectural, multi-step or needs coordination
  risk:
    multi: false
    page: false
    doc: Risk of the change breaking existing users, or of the situation if nothing is done (register entries only).
    values:
      low: contained; easy to revert
      medium: touches shared behaviour; needs care
      high: could break many users or the project's viability
